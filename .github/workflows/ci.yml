name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: web/app/package-lock.json

      - name: Web deps
        working-directory: web/app
        run: npm ci

      - name: Web tests
        working-directory: web/app
        run: npm test --if-present

      # The Go binary embeds web/dist; build it before vet/test/build.
      - name: Web build
        working-directory: web/app
        run: npm run build

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test -race ./...

      - name: Go build
        run: CGO_ENABLED=0 go build ./cmd/messer-paste
